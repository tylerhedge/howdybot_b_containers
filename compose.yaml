# docker compose file for both environments.
#
#   On the Jetson:   docker compose up -d          (starts only "robot")
#   On a laptop:     open the folder in VS Code -> "Reopen in Container"
#                    (or: docker compose --profile dev up -d dev)
#
# Settings come from .env (copy .env.example -> .env).
name: howdybot

x-ros-common: &ros-common
  network_mode: host   # DDS discovery "just works" between containers/laptops
  ipc: host            # lets CycloneDDS use shared memory between processes
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

services:
  # ---------------------------------------------------------------- robot ---
  robot:
    <<: *ros-common
    image: ${HOWDYBOT_IMAGE:-howdybot:robot}
    build:                      # fallback: build on the Jetson itself
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        BASE_IMAGE: ${ROBOT_BASE_IMAGE:-nvcr.io/nvidia/cuda:13.0.0-runtime-ubuntu24.04}
    restart: unless-stopped     # comes back automatically after every boot
    privileged: true            # simplest access to USB LiDARs/cameras/audio; tighten later
    volumes:
      - /dev:/dev               # hot-plugged USB devices appear inside
      - ./config:/opt/howdybot/config:ro   # params/maps/audio you can edit without rebuilding
      - ./data:/opt/howdybot/data          # logs, rosbags
    environment:
      <<: *ros-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ------------------------------------------------------------------ dev ---
  dev:
    <<: *ros-common
    profiles: [dev]             # never starts on the robot by accident
    image: howdybot:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        BASE_IMAGE: ${DEV_BASE_IMAGE:-ubuntu:24.04}
    volumes:
      - .:/home/ros/howdybot:cached          # your repo, live-edited
      - /tmp/.X11-unix:/tmp/.X11-unix:rw     # RViz/Gazebo windows (Linux / WSL2)
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    command: sleep infinity
